/* GALLERY TITLE */

.gallery-title {
    text-align: center;
    margin-top: 50px;
    color: #ffc4e1;
    font-size: 40px;
}

/* 3D CAROUSEL */

.carousel {
    width: 900px;
    height: 500px;
    position: relative;
    margin: 120px auto 0;
    perspective: 1000px;
    transform-style: preserve-3d;
}

@keyframes rotateCarousel {
    from {
        transform: rotateY(360deg);
    }

    to {
        transform: rotateY(360deg);
    }
}

/* VIDEO CARDS */

.video-card {
    width: 250px;
    height: 250px;
    position: absolute;
    top: 100px;
    left: 325px;
    overflow: hidden;
    border-radius: 15px;
    background: black;
}

.video-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* CAROUSEL POSITIONS */

.card1 {
    animation: card1Move 10s linear infinite;
}

.card2 {
    animation: card2Move 10s linear infinite;
}

.card3 {
    animation: card3Move 10s linear infinite;
}

.card4 {
    animation: card4Move 10s linear infinite;
}

.card5 {
    animation: card5Move 10s linear infinite;
}


/* CARD 1 */

@keyframes card1Move {
    0%, 20% {
        transform: translateX(-300px) translateZ(-100px) rotateY(45deg);
        z-index: 1;
    }

    20%, 40% {
        transform: translateX(-150px) translateZ(100px) rotateY(25deg);
        z-index: 2;
    }

    40%, 60% {
        transform: translateZ(250px);
        z-index: 5;
    }

    60%, 80% {
        transform: translateX(150px) translateZ(100px) rotateY(-25deg);
        z-index: 2;
    }

    80%, 100% {
        transform: translateX(300px) translateZ(-100px) rotateY(-45deg);
        z-index: 1;
    }
}


/* CARD 2 */

@keyframes card2Move {
    0%, 20% {
        transform: translateX(-150px) translateZ(100px) rotateY(25deg);
        z-index: 2;
    }

    20%, 40% {
        transform: translateZ(250px);
        z-index: 5;
    }

    40%, 60% {
        transform: translateX(150px) translateZ(100px) rotateY(-25deg);
        z-index: 2;
    }

    60%, 80% {
        transform: translateX(300px) translateZ(-100px) rotateY(-45deg);
        z-index: 1;
    }

    80%, 100% {
        transform: translateX(-300px) translateZ(-100px) rotateY(45deg);
        z-index: 1;
    }
}


/* CARD 3 */

@keyframes card3Move {
    0%, 20% {
        transform: translateZ(250px);
        z-index: 5;
    }

    20%, 40% {
        transform: translateX(150px) translateZ(100px) rotateY(-25deg);
        z-index: 2;
    }

    40%, 60% {
        transform: translateX(300px) translateZ(-100px) rotateY(-45deg);
        z-index: 1;
    }

    60%, 80% {
        transform: translateX(-300px) translateZ(-100px) rotateY(45deg);
        z-index: 1;
    }

    80%, 100% {
        transform: translateX(-150px) translateZ(100px) rotateY(25deg);
        z-index: 2;
    }
}


/* CARD 4 */

@keyframes card4Move {
    0%, 20% {
        transform: translateX(150px) translateZ(100px) rotateY(-25deg);
        z-index: 2;
    }

    20%, 40% {
        transform: translateX(300px) translateZ(-100px) rotateY(-45deg);
        z-index: 1;
    }

    40%, 60% {
        transform: translateX(-300px) translateZ(-100px) rotateY(45deg);
        z-index: 1;
    }

    60%, 80% {
        transform: translateX(-150px) translateZ(100px) rotateY(25deg);
        z-index: 2;
    }

    80%, 100% {
        transform: translateZ(250px);
        z-index: 5;
    }
}


/* CARD 5 */

@keyframes card5Move {
    0%, 20% {
        transform: translateX(300px) translateZ(-100px) rotateY(-45deg);
        z-index: 1;
    }

    20%, 40% {
        transform: translateX(-300px) translateZ(-100px) rotateY(45deg);
        z-index: 1;
    }

    40%, 60% {
        transform: translateX(-150px) translateZ(100px) rotateY(25deg);
        z-index: 2;
    }

    60%, 80% {
        transform: translateZ(250px);
        z-index: 5;
    }

    80%, 100% {
        transform: translateX(150px) translateZ(100px) rotateY(-25deg);
        z-index: 2;
    }
}

/* HEART ANIMATION*/

@keyframes floatHeart {

0% {
bottom: -50px;
opacity: 0;
transform: translateX(0) scale(0.5);
   }

20% {
opacity: 1;
}

50% {

<!-- FULL VIDEO POPUP -->

<div id="videoPopup" class="video-popup">

    <span class="close"
          onclick="closeVideo()">×</span>

    <video id="fullVideo" controls></video>

</div>


<!-- JAVASCRIPT -->

<script>

function openVideo(videoFile) {

    let popup =
        document.getElementById("videoPopup");

    let video =
        document.getElementById("fullVideo");

    video.src = videoFile;

    popup.style.display = "flex";

    video.play();

}


function closeVideo() {

    let popup =
        document.getElementById("videoPopup");

    let video =
        document.getElementById("fullVideo");

    video.pause();

    video.currentTime = 0;

    video.src = "";

    popup.style.display = "none";

}

</script>
