/*MOVING HEARTS*/

.heart {
position: fixed;
bottom: -50px;
font-size: 35px;
color: #ff4f9a;
animation-name: floatHeart;
animation-duration: 6s;
animation-iteration-count: infinite;
animation-timing-function: linear;

pointer-events: none;
}

/* HEART POSITIONS */

.heart1 {
left: 15%;
animation-delay: 0s;
        }

.heart2 {
left: 10%;
animation-delay: 1.5s;
        }

.heart3 {
left: 55%;
animation-delay: 3s;
        }

.heart4 {
left: 25%;
animation-delay: 4.5s;
        }

.heart5 {
left: 75%;
animation-delay: 3.5s;
        }

.heart6 {
left: 80%;
animation-delay: 2s;
        }

.heart7 {
left: 90%;
animation-delay: 4s;
        }


/* HEART ANIMATION*/

@keyframes floatHeart {

0% {
bottom: -50px;
opacity: 0;
transform: translateX(0) scale(0.5);
   }

20% {
opacity: 1;
}

50% {
transform: translateX(40px) scale(1);
}

80% {
opacity: 1;
}

100% {
bottom: 100vh;
opacity: 0;
transform: translateX(-40px) scale(1.2);
}
}

.memory-gallery {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    margin: 30px auto;

}

.memory-gallery img {

    width: 100%;

    height: 350px;

    object-fit: cover;
